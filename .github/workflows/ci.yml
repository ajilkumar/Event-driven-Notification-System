name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: events_db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          cd services/event-api && npm install
          cd ../worker && npm install

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/events_db
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          PORT: 3000
          NODE_ENV: test

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Event API Docker Build
        run: docker build -t event-api -f services/event-api/Dockerfile .

      - name: Verify Worker Docker Build
        run: docker build -t worker -f services/worker/Dockerfile .
